name: 8K Cloud Map Harvester

on:
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute rounded timestamp
        id: timestamp
        run: |
          HOUR=$(( 10#$(date +'%H') ))
          ROUNDED_HOUR=$(( (HOUR / 3) * 3 ))
          TIMESTAMP="$(date +'%Y%m%d')_$(printf '%02d00' $ROUNDED_HOUR)"
          echo "value=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "ROUNDED_TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 8K Downloader
        run: python live-cloud-maps-downloader.py

      # Asset uploads to GitHub occasionally drop mid-transfer ("other side
      # closed", 5xx) and leave a draft holding only some of the maps. So the
      # release is judged by what it actually holds: missing or short assets are
      # re-uploaded until every file is there, and only then is it published.
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: maps-${{ steps.timestamp.outputs.value }}
          TITLE: EarthCloudMaps_${{ steps.timestamp.outputs.value }}
        run: bash scripts/publish_release.sh
